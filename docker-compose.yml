services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # OJO: NO montamos todo el repo aquí. Si montáramos "./:/var/www/html",
      # taparíamos el directorio /vendor que Composer instaló DENTRO de la imagen
      # durante el build (tu carpeta local no tiene vendor/), y Laravel dejaría
      # de encontrar vendor/autoload.php -> el contenedor entraría en loop de
      # reinicio y nginx respondería 502/503. Por eso solo montamos el .env,
      # para que tus cambios a Stripe/DB se apliquen sin tener que reconstruir.
      - ./.env:/var/www/html/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Este sí puede montar todo el repo: nginx nunca ejecuta PHP, solo
      # necesita saber que existe public/index.php para armar la ruta que
      # le pasa a php-fpm (el contenedor "app"), así que no le afecta la
      # ausencia de vendor/ en el host.
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ecommerce_net

  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - ecommerce_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ecommerce_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - ecommerce_net

networks:
  ecommerce_net:
    driver: bridge

volumes:
  ecommerce_mysql_data:
    driver: local
